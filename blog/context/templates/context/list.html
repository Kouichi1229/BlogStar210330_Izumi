{% extends 'context/base.html' %}
{% load static %}
{% block content %}

<header class="w3-container w3-center w3-padding-32">
  <h1><b>IT勉強帳</b></h1>
</header>

<div class="w3-row">
  {% for post in blog_post %}
    <div class="w3-col l8 s12">
      <div class="w3-card-4 w3-margin w3-white">
        <div class="w3-container">
          <h3><b>{{ post.title }}</b></h3>
          <h5><span class="w3-opacity">{{ post.published_time }}</span></h5>
        </div>
        <div class="w3-container">
          <div class="w3-row">
            <div class="w3-col m8 s12">
              <p>
                <a href="{% url 'blog:detail' post.id %}" class="w3-button w3-padding-large w3-white w3-border">
                  <b>READ MORE »</b>
                </a>
              </p>
            </div>
          </div>
        </div>
      </div>
      <hr>
    </div>
  {% empty %}
    <div class="w3-container">
      <p>目前還沒有文章。登入 Django Admin 後即可新增文章。</p>
    </div>
  {% endfor %}
</div>
{% endblock %}
