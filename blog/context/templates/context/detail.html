{% extends 'context/base.html' %}
{% load sanitize_html %}
{% block content %}

<div class="w3-main" style="margin-left:250px">
  <div class="w3-row w3-padding-64">
    <div class="w3-twothird w3-container">
      <h1 class="w3-text-teal">{{ blog_post.title }}</h1>
      <p>{{ blog_post.published_time }}</p>
      <div>{{ blog_post.content|sanitize_html }}</div>
    </div>
    <div class="w3-third w3-container">
      <p class="w3-border w3-padding-large w3-padding-32 w3-center"></p>
      <p class="w3-border w3-padding-large w3-padding-64 w3-center"></p>
    </div>
  </div>
  <br>
  <p>
    <a href="{% url 'blog:list' %}" class="btn btn-outline-primary">戻る/Back</a>
    {% if user.is_staff %}
      <a href="{% url 'admin:context_blog_posts_change' blog_post.id %}" class="btn btn-outline-secondary">編集 / Admin</a>
    {% endif %}
  </p>
</div>
{% endblock %}
